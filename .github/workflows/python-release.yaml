# Based on <https://github.com/liblaf/copier-python>.
# Keep the existing-tag retry path when updating this workflow from the template.

name: Python / Release

on:
  # Trigger only when a GitHub Release is published, so the release exists before assets are uploaded.
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to build and upload
        required: true
        type: string

env:
  FORCE_COLOR: 1

jobs:
  build:
    name: Build
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      package-name: ${{ steps.build.outputs.package_name }}
      package-version: ${{ steps.build.outputs.package_version }}
    steps:
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |-
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq 'if .isDraft then error("release is a draft") else "published" end'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0
      - id: build
        name: Build and inspect a Python package
        uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        with:
          attest-build-provenance-github: true

  pypi:
    name: Publish to PyPI
    permissions:
      attestations: write
      id-token: write
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.package-name }}/${{ needs.build.outputs.package-version }}/
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: ${{ runner.debug == '1' }}
          print-hash: true
          attestations: true

  github:
    name: GitHub Release
    permissions:
      contents: write
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: false
          files: dist/*
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
